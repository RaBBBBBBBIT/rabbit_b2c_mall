server:
  port: ${EMPLOYEE_SERVER_PORT:8082}

spring:
  application:
    name: employee-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${EMPLOYEE_DB_URL:jdbc:sqlite:./b2c_mall_employee.db}
  sql:
    init:
      mode: always
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

employee:
  default-avatar-url: ${DEFAULT_AVATAR_URL:}

jwt:
  token:
    key: ${JWT_TOKEN_KEY:local-dev-only-change-this-secret-32chars}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}

mall:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:local-internal-token-change-me}
