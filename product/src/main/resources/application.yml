server:
  port: ${PRODUCT_SERVER_PORT:8083}
spring:
  application:
    name: product-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${PRODUCT_DB_URL:jdbc:sqlite:./b2c_mall_product.db}
  sql:
    init:
      mode: always
jwt:
  token:
    key: ${JWT_TOKEN_KEY:local-dev-only-change-this-secret-32chars}
employee:
  service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8082}
mall:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:local-internal-token-change-me}
